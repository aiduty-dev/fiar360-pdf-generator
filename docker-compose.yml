services:
  fiar360-pdf-generator:
    build: .
    image: fiar360-pdf-generator:latest
    container_name: fiar360-pdf-generator
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - TZ=Europe/Bucharest
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

